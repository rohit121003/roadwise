<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<title>Roadwise Driving</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <button id="btnPause" class="icon-btn" aria-label="Pause">II</button>
    <div class="hud-mid">
      <div id="hudMode" class="hud-mode"></div>
      <div class="bar"><div id="hudProg" class="bar-fill"></div></div>
      <div id="hudSub" class="hud-sub"></div>
    </div>
    <div id="hudLives" class="lives" aria-label="Lives"></div>
  </div>
  <div id="toast" class="toast"></div>
  <div class="gauges">
    <div class="speedo"><span id="hudSpeed">0</span><small>km/h</small></div>
    <div class="gear">GEAR <b id="hudGear">N</b></div>
    <div class="fuel"><div class="fuel-label">FUEL</div><div class="bar vbar"><div id="hudFuel" class="bar-fill"></div></div></div>
  </div>
  <div class="controls">
    <div id="wheel" class="wheel" aria-label="Steering wheel">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#e9ecf1" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="#10151c" stroke-width="2" opacity=".4"/><rect x="44" y="6" width="12" height="9" rx="2" fill="#f5a623"/><path d="M12 54 H88 M50 54 V92" stroke="#e9ecf1" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="54" r="9" fill="#2b323d" stroke="#e9ecf1" stroke-width="3"/></svg>
    </div>
    <div class="pedals">
      <button id="pedBrake" class="pedal brake">BRAKE</button>
      <button id="pedGas" class="pedal gas">GAS</button>
    </div>
    <button id="btnHorn" class="icon-btn horn" aria-label="Horn">HORN</button>
  </div>
</div>

<!-- Menu -->
<section id="menu" class="screen">
  <div class="panel center">
    <div class="logo">ROADWISE<span>DRIVING</span></div>
    <div class="tag">Learn to drive. Every car unlocked. No ads.</div>
    <button id="mPlay" class="btn primary">Play</button>
    <button id="mGarage" class="btn">Garage</button>
    <button id="mSound" class="btn ghost">Sound: On</button>
    <div class="coins-line">Coins <b id="mCoins">0</b></div>
  </div>
</section>

<!-- Mode select -->
<section id="modes" class="screen hidden">
  <div class="panel wide">
    <h2>Choose a mission</h2>
    <div class="cards" id="modeCards"></div>
    <div class="row"><button id="modesBack" class="btn ghost">Back</button><button id="modesGarage" class="btn">Change car</button></div>
  </div>
</section>

<!-- Garage -->
<section id="garage" class="screen hidden">
  <div class="panel wide">
    <h2>Garage <small>all 12 cars unlocked</small></h2>
    <div class="garage-grid" id="garageGrid"></div>
    <div class="row"><button id="garageBack" class="btn primary">Done</button></div>
  </div>
</section>

<!-- Pause -->
<section id="pause" class="screen hidden">
  <div class="panel center">
    <h2>Paused</h2>
    <button id="pResume" class="btn primary">Resume</button>
    <button id="pRestart" class="btn">Restart</button>
    <button id="pQuit" class="btn ghost">Quit to menu</button>
  </div>
</section>

<!-- Result -->
<section id="result" class="screen hidden">
  <div class="panel center">
    <h2 id="rTitle">Mission</h2>
    <div id="rVerdict" class="verdict"></div>
    <div id="rStats" class="stats"></div>
    <div class="coins-line">+<b id="rCoins">0</b> coins <span id="rBest"></span></div>
    <button id="rRetry" class="btn primary">Retry</button>
    <button id="rMenu" class="btn">Menu</button>
  </div>
</section>

<script src="js/cars.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
